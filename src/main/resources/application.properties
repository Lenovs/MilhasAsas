# ===============================
# CONFIGURAÇÕES DE JWT
# ===============================
jwt.secret=MinhaChaveSecretaSuperSegura123
jwt.expiration=3600000

# ===============================
# CONFIGURAÇÕES DE SERVIDOR
# ===============================
server.port=8080